resources:
  jobs:
    gastat_silver_gold:
      name: gastat_silver_gold
      timeout_seconds: 7200
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - reynadalman.flores@gmail.com

      tasks:
        - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/silver/gastat_silver_build.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
          max_retries: 1
          timeout_seconds: 7200

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/gold/gastat_gold_build.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
          max_retries: 1
          timeout_seconds: 7200
